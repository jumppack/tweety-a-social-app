syntax = "proto3";
package tweety.feed;

import "common.proto";
import "posts.proto";

service FeedService {
  rpc GetHomeFeed(GetHomeFeedRequest) returns (tweety.posts.PostsResponse);
  rpc GetExploreFeed(GetExploreFeedRequest) returns (tweety.posts.PostsResponse);
}

message GetHomeFeedRequest {
  string session_token = 1;
  tweety.common.PaginationRequest pagination = 2;
}

message GetExploreFeedRequest {
  tweety.common.PaginationRequest pagination = 1;
  optional string session_token = 2;
}
